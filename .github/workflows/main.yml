name: Build StandUP APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Unzip project
        run: |
          unzip -o StandUP_Android_Project.zip -d project

      - name: Check project
        run: |
          find project -name settings.gradle -o -name gradlew

      - name: Build APK
        run: |
          cd project
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StandUP
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
